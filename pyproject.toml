[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-ai"
version = "0.1.0"
description = "Financial decision-support platform (planning scaffold)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "alembic>=1.14,<2",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "mlflow>=2.20,<4",
  "qdrant-client>=1.13,<2",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
rag = [
  "langchain>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "sentence-transformers>=3.4,<6",
]
models = [
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "httpx2>=2,<3",
  "openpyxl>=3.1,<4",
]
data = [
  "openpyxl>=3.1,<4",
]
dev = [
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
